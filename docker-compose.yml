services:
  mongo:
    image: mongo:7
    container_name: edunexa-mongo
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: ["edunexa-mongo:/data/db"]
  redis:
    image: redis:7-alpine
    container_name: edunexa-redis
    restart: unless-stopped
    ports: ["6379:6379"]
volumes:
  edunexa-mongo:
